    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c5cf5'/%3E%3Cstop offset='100%25' stop-color='%232cb5a8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='url(%23g)'/%3E%3Cpath d='M8 26 L16 26 L19 20 L23 32 L26 24 L29 28 L40 28' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 12 h4 v4 h4 v4 h-4 v4 h-4 v-4 h-4 v-4 h4 z' fill='white'/%3E%3C/svg%3E" />
  </head>

  <body>
    <script>
      // Apply saved theme (or device preference) before React mounts so the
      // splash screen and first paint match — no flash of the wrong theme.
      (function () {
        try {
          var p = window.location.pathname || '';
          if (p.indexOf('/e/') === 0) {
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            return;
          }
          var stored = null;
          try { stored = localStorage.getItem('medora-theme'); } catch (e) {}
          var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var resolved = mode;
          if (mode === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
